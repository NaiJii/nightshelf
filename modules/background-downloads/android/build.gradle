plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.backgrounddownloads'
version = '1.0.0'
android {
  namespace "expo.modules.backgrounddownloads"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.10.5'
  testImplementation 'junit:junit:4.13.2'
}
